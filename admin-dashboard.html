<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard – GymPro</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<nav>
  <a class="nav-brand" href="/admin-dashboard.html">🏋️ GymPro Admin</a>
  <div class="nav-links">
    <a href="/admin-dashboard.html" class="active">Dashboard</a>
    <a href="/admin-bookings.html">Booking Logs</a>
    <span id="nav-username" style="color:var(--muted);font-size:0.9rem;"></span>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1>📊 Admin Dashboard</h1>
    <button class="btn btn-primary" onclick="openCreateModal()">+ New Class</button>
  </div>

  <div class="stats-grid" id="stats-grid">
    <div class="stat-card"><div class="stat-icon">🗓️</div><div class="stat-info"><h3 id="stat-classes">—</h3><p>Total Classes</p></div></div>
    <div class="stat-card"><div class="stat-icon">💺</div><div class="stat-info"><h3 id="stat-spots">—</h3><p>Available Spots</p></div></div>
    <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-info"><h3 id="stat-bookings">—</h3><p>Active Bookings</p></div></div>
  </div>

  <div id="alert-box"></div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Title</th><th>Category</th><th>Instructor</th>
            <th>Schedule</th><th>Capacity</th><th>Spots Left</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="classes-tbody">
          <tr><td colspan="8"><div class="loading-center"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Create / Edit Modal -->
<div class="modal-overlay" id="class-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">New Class</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-alert"></div>

    <div class="form-group">
      <label>Title</label>
      <input type="text" id="f-title" placeholder="Morning Yoga" />
    </div>
    <div class="form-group">
      <label>Instructor</label>
      <input type="text" id="f-instructor" placeholder="Jane Smith" />
    </div>
    <div class="form-group">
      <label>Category</label>
      <select id="f-category">
        <option value="Yoga">Yoga</option>
        <option value="HIIT">HIIT</option>
        <option value="Strength">Strength</option>
      </select>
    </div>
    <div class="form-group">
      <label>Capacity</label>
      <input type="number" id="f-capacity" min="1" placeholder="20" />
    </div>
    <div class="form-group">
      <label>Schedule Time</label>
      <input type="datetime-local" id="f-schedule" />
    </div>

    <div style="display:flex;gap:1rem;margin-top:1.5rem;">
      <button class="btn btn-primary" style="flex:1" id="modal-submit-btn" onclick="submitClass()">Create</button>
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>Delete Class</h2>
      <button class="modal-close" onclick="document.getElementById('delete-modal').classList.remove('open')">×</button>
    </div>
    <p style="color:var(--muted);margin-bottom:1.5rem;">Are you sure you want to delete this class? This cannot be undone.</p>
    <div style="display:flex;gap:1rem;">
      <button class="btn btn-danger" style="flex:1" onclick="confirmDelete()">Delete</button>
      <button class="btn btn-outline" style="flex:1" onclick="document.getElementById('delete-modal').classList.remove('open')">Cancel</button>
    </div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
  requireAdmin();
  setNavUser();

  let editingId = null;
  let deletingId = null;

  async function loadClasses() {
    try {
      const classes = await api("GET", "/classes");
      renderTable(classes);

      // stats
      const allBookings = await api("GET", "/bookings");
      const active = allBookings.filter(b => b.status === "confirmed").length;
      const totalSpots = classes.reduce((s, c) => s + c.available_spots, 0);
      document.getElementById("stat-classes").textContent = classes.length;
      document.getElementById("stat-spots").textContent = totalSpots;
      document.getElementById("stat-bookings").textContent = active;
    } catch (e) {
      showAlert("#alert-box", e.message);
    }
  }

  function renderTable(classes) {
    const tbody = document.getElementById("classes-tbody");
    if (!classes.length) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="icon">📭</div><p>No classes yet.</p></div></td></tr>';
      return;
    }
    tbody.innerHTML = classes.map(c => `
      <tr>
        <td>${c.id}</td>
        <td><strong>${c.title}</strong></td>
        <td>${categoryBadge(c.category)}</td>
        <td>${c.instructor}</td>
        <td>${formatDate(c.schedule_time)}</td>
        <td>${c.capacity}</td>
        <td>
          <span style="color:${c.available_spots === 0 ? 'var(--danger)' : 'var(--success)'};font-weight:600;">
            ${c.available_spots}
          </span>
        </td>
        <td style="display:flex;gap:0.5rem;">
          <button class="btn btn-outline" style="padding:0.35rem 0.8rem;" onclick="openEditModal(${c.id},'${escStr(c.title)}','${escStr(c.instructor)}','${c.category}',${c.capacity},'${c.schedule_time}')">Edit</button>
          <button class="btn btn-danger" style="padding:0.35rem 0.8rem;" onclick="openDeleteModal(${c.id})">Delete</button>
        </td>
      </tr>`).join("");
  }

  function escStr(s) { return (s || "").replace(/'/g, "\\'"); }

  function openCreateModal() {
    editingId = null;
    document.getElementById("modal-title").textContent = "New Class";
    document.getElementById("modal-submit-btn").textContent = "Create";
    ["f-title","f-instructor","f-capacity","f-schedule"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("f-category").value = "Yoga";
    document.getElementById("modal-alert").innerHTML = "";
    document.getElementById("class-modal").classList.add("open");
  }

  function openEditModal(id, title, instructor, category, capacity, scheduleTime) {
    editingId = id;
    document.getElementById("modal-title").textContent = "Edit Class";
    document.getElementById("modal-submit-btn").textContent = "Update";
    document.getElementById("f-title").value = title;
    document.getElementById("f-instructor").value = instructor;
    document.getElementById("f-category").value = category;
    document.getElementById("f-capacity").value = capacity;
    const dt = new Date(scheduleTime);
    document.getElementById("f-schedule").value = dt.toISOString().slice(0,16);
    document.getElementById("modal-alert").innerHTML = "";
    document.getElementById("class-modal").classList.add("open");
  }

  function closeModal() {
    document.getElementById("class-modal").classList.remove("open");
    editingId = null;
  }

  function openDeleteModal(id) {
    deletingId = id;
    document.getElementById("delete-modal").classList.add("open");
  }

  async function confirmDelete() {
    if (!deletingId) return;
    try {
      await api("DELETE", `/classes/${deletingId}`);
      document.getElementById("delete-modal").classList.remove("open");
      showAlert("#alert-box", "Class deleted.", "success");
      loadClasses();
    } catch (e) {
      showAlert("#alert-box", e.message);
    }
    deletingId = null;
  }

  async function submitClass() {
    const title = document.getElementById("f-title").value.trim();
    const instructor = document.getElementById("f-instructor").value.trim();
    const category = document.getElementById("f-category").value;
    const capacity = parseInt(document.getElementById("f-capacity").value);
    const schedule = document.getElementById("f-schedule").value;

    if (!title || !instructor || !capacity || !schedule)
      return showAlert("#modal-alert", "Please fill in all fields");

    const payload = {
      title, instructor, category, capacity,
      schedule_time: new Date(schedule).toISOString()
    };

    try {
      if (editingId) {
        await api("PUT", `/classes/${editingId}`, payload);
        showAlert("#alert-box", "Class updated!", "success");
      } else {
        await api("POST", "/classes", payload);
        showAlert("#alert-box", "Class created!", "success");
      }
      closeModal();
      loadClasses();
    } catch (e) {
      showAlert("#modal-alert", e.message);
    }
  }

  loadClasses();
</script>
</body>
</html>
