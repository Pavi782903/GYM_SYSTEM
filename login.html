<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – GymPro</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <h1>🏋️ GymPro</h1>
      <p>Sign in to your account</p>
    </div>

    <div id="alert-box"></div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">Sign In</button>

    <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--muted);">
      Don't have an account? <a href="/register.html" style="color:var(--primary);font-weight:600;">Register</a>
    </p>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
  if (getToken()) window.location.href = "/classes.html";

  document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

  async function doLogin() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) return showAlert("#alert-box", "Please fill in all fields");
    try {
      const data = await api("POST", "/auth/login", { email, password });
      localStorage.setItem("token", data.access_token);
      const me = await api("GET", "/auth/me");
      localStorage.setItem("user", JSON.stringify(me));
      window.location.href = me.role === "admin" ? "/admin-dashboard.html" : "/classes.html";
    } catch (e) {
      showAlert("#alert-box", e.message);
    }
  }
</script>
</body>
</html>
