<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – GymPro</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <h1>🏋️ GymPro</h1>
      <p>Create your account</p>
    </div>

    <div id="alert-box"></div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Jane Doe" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>
    <div class="form-group">
      <label>Role</label>
      <select id="role">
        <option value="member">Member</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="doRegister()">Create Account</button>

    <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--muted);">
      Already have an account? <a href="/login.html" style="color:var(--primary);font-weight:600;">Sign In</a>
    </p>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script>
  async function doRegister() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;
    if (!name || !email || !password) return showAlert("#alert-box", "Please fill in all fields");
    try {
      await api("POST", "/auth/register", { name, email, password, role });
      showAlert("#alert-box", "Account created! Redirecting…", "success");
      setTimeout(() => window.location.href = "/login.html", 1500);
    } catch (e) {
      showAlert("#alert-box", e.message);
    }
  }
</script>
</body>
</html>
